name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Positive benchmark fixture scale
        required: true
        default: "1"
      max-results:
        description: Enumeration result limit
        required: true
        default: "100"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run reproducible scenarios
        run: >-
          python benchmarks/run.py
          --scale "${{ inputs.scale }}"
          --max-results "${{ inputs.max-results }}"
          > benchmark.json
      - name: Validate JSON output
        run: python -m json.tool benchmark.json > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-python-3.13-scale-${{ inputs.scale }}
          path: benchmark.json
          if-no-files-found: error
          retention-days: 30
