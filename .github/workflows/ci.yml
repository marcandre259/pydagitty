name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest

  static:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install quality dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Run documented examples
        run: |
          python examples/confounding_workflow.py
          python examples/model_analysis.py

  build:
    name: Build and validate distributions
    needs: [test, static]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata rendering
        run: python -m twine check dist/*
      - name: Validate artifact versions
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          import email.parser
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          artifacts = Path("dist")
          wheels = list(artifacts.glob("*.whl"))
          sdists = list(artifacts.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"expected one wheel and one sdist, found {len(wheels)} and {len(sdists)}"
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit("wheel does not contain exactly one METADATA file")
              wheel_metadata = archive.read(metadata_files[0]).decode("utf-8")

          with tarfile.open(sdists[0], "r:gz") as archive:
              metadata_files = [
                  member
                  for member in archive.getmembers()
                  if Path(member.name).name == "PKG-INFO"
                  and len(Path(member.name).parts) == 2
              ]
              if len(metadata_files) != 1:
                  raise SystemExit("sdist does not contain exactly one PKG-INFO file")
              extracted = archive.extractfile(metadata_files[0])
              if extracted is None:
                  raise SystemExit("could not read sdist PKG-INFO")
              sdist_metadata = extracted.read().decode("utf-8")

          parser = email.parser.Parser()
          versions = {
              "wheel": parser.parsestr(wheel_metadata)["Version"],
              "sdist": parser.parsestr(sdist_metadata)["Version"],
          }
          if None in versions.values() or len(set(versions.values())) != 1:
              raise SystemExit(f"artifact versions do not match: {versions}")

          version = versions["wheel"]
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              expected = tag.removeprefix("v")
              if not tag.startswith("v") or not expected or version != expected:
                  raise SystemExit(
                      f"artifact version {version!r} does not exactly match tag {tag!r}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Validated wheel and sdist version {version}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.artifact }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            artifact: wheel
            pattern: "*.whl"
            render: false
          - os: ubuntu-latest
            python-version: "3.13"
            artifact: sdist
            pattern: "*.tar.gz"
            render: true
          - os: macos-latest
            python-version: "3.10"
            artifact: sdist
            pattern: "*.tar.gz"
            render: false
          - os: macos-latest
            python-version: "3.13"
            artifact: wheel
            pattern: "*.whl"
            render: false
          - os: windows-latest
            python-version: "3.10"
            artifact: wheel
            pattern: "*.whl"
            render: false
          - os: windows-latest
            python-version: "3.13"
            artifact: sdist
            pattern: "*.tar.gz"
            render: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Install Graphviz executable
        if: matrix.render
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes graphviz
      - name: Install ${{ matrix.artifact }} with visualization support
        shell: bash
        run: |
          ARTIFACT=$(python -c "from pathlib import Path; print(next(Path('dist').glob('${{ matrix.pattern }}')))" )
          python -m pip install "${ARTIFACT}[viz]"
      - name: Smoke-test installed artifact
        shell: bash
        run: >-
          python tests/smoke_artifact.py
          --expected-version "${{ needs.build.outputs.version }}"
          ${{ matrix.render && '--render' || '' }}

  publish:
    name: Publish stable release to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, static, build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pydagitty
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
