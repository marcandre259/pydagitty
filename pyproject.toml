[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pydagitty"
dynamic = ["version"]
description = "Native Python causal graph algorithms inspired by Dagitty"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "PyDagitty contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/marcandre259/pydagitty"
Repository = "https://github.com/marcandre259/pydagitty"
Issues = "https://github.com/marcandre259/pydagitty/issues"

[project.optional-dependencies]
viz = ["graphviz>=0.20"]
dev = [
  "graphviz>=0.20",
  "hypothesis>=6.98",
  "mypy>=1.8",
  "pytest>=7.4",
  "ruff>=0.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
pydagitty = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"
local_scheme = "no-local-version"
version_file = "src/pydagitty/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pydagitty"]

[[tool.mypy.overrides]]
module = "graphviz"
ignore_missing_imports = true
